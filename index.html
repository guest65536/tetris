<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10141C">
  <title>テトリス</title>

  <!-- PWA(ホーム画面追加・オフライン対応) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="テトリス">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- 上部: スコアと操作ボタン -->
    <header class="topbar">
      <div class="score-box">
        <span class="score-label">スコア</span>
        <span id="score" class="score-value">0</span>
      </div>
      <div class="topbar-buttons">
        <button id="mute-btn" class="icon-btn" aria-label="音のオン・オフ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <button id="pause-btn" class="icon-btn" aria-label="一時停止">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
      </div>
    </header>

    <!-- 中央: ゲーム盤と次のミノ -->
    <main class="play-area">
      <canvas id="board" class="board"></canvas>
      <div class="side">
        <div class="next-box">
          <span class="next-label">つぎ</span>
          <canvas id="next" class="next-canvas"></canvas>
        </div>
      </div>
    </main>

    <!-- 下部: 十字キー風の操作ボタン -->
    <div class="controls">
      <button id="btn-rotate" class="ctrl-btn ctrl-rotate" aria-label="回転">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5H5c0 3.87 3.13 7 7 7s7-3.13 7-7-3.13-7-7-7z"/></svg>
      </button>
      <button id="btn-left"   class="ctrl-btn ctrl-left"   aria-label="左へ">
        <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="62,16 62,84 24,50"/></svg>
      </button>
      <button id="btn-down"   class="ctrl-btn ctrl-down"   aria-label="下へ">
        <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="16,38 84,38 50,76"/></svg>
      </button>
      <button id="btn-right"  class="ctrl-btn ctrl-right"  aria-label="右へ">
        <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="38,16 38,84 76,50"/></svg>
      </button>
    </div>

    <!-- スタート／使い方の画面 -->
    <div id="start-screen" class="overlay">
      <div class="overlay-card">
        <h1 class="overlay-title">テトリス</h1>
        <div class="howto">
          <p><span class="key">◀ ▶</span> 左右にうごかす</p>
          <p><span class="key">回転</span> ブロックをまわす</p>
          <p><span class="key">▼</span> ひとつ下におろす</p>
          <p class="howto-note">よこ一列そろえると消えます</p>
        </div>
        <button id="start-btn" class="big-btn">スタート</button>
      </div>
    </div>

    <!-- 一時停止の画面 -->
    <div id="pause-screen" class="overlay hidden">
      <div class="overlay-card">
        <h2 class="overlay-title">一時停止</h2>
        <button id="resume-btn" class="big-btn">つづける</button>
      </div>
    </div>

    <!-- ゲームオーバーの画面 -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="overlay-card">
        <h2 class="overlay-title">おしまい</h2>
        <p class="final-score">スコア <span id="final-score">0</span></p>
        <button id="retry-btn" class="big-btn">もう一度</button>
      </div>
    </div>

  </div>
  <script src="game.js"></script>
</body>
</html>
